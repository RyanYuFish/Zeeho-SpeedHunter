plugins {
    id 'com.android.application'
}

// 发布签名：口令优先读本地 signing.properties（不进 git），其次 -P 传参 / 环境变量，
// 最后 gradle.properties。三者齐全才用 release/release.jks 签名，否则回退 debug 签名。
def signingProps = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingProps.load(signingFile.newInputStream())

def secret = { String key ->
    signingProps.getProperty(key) ?: project.findProperty(key) ?: System.getenv(key)
}

def releaseKeyReady = {
    rootProject.file('release/release.jks').exists() &&
            secret('STORE_PASSWORD') && secret('KEY_ALIAS') && secret('KEY_PASSWORD')
}

android {
    namespace 'com.github.zeehospeedhunter'
    compileSdk 35

    defaultConfig {
        applicationId "com.github.zeehospeedhunter"
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName "3.0"
    }

    signingConfigs {
        release {
            storeFile file('../release/release.jks')
            storePassword secret('STORE_PASSWORD')
            keyAlias secret('KEY_ALIAS')
            keyPassword secret('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig releaseKeyReady() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // release 产物统一命名
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            if (variant.buildType.name == 'release') {
                output.outputFileName = "zeeho-speedhunter-v${variant.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// 编完自动拷一份到 release/（AGP 8 的任务是延迟创建的，必须放进 afterEvaluate）
afterEvaluate {
    tasks.matching { it.name == 'assembleRelease' }.configureEach {
        doLast {
            def apk = "zeeho-speedhunter-v${android.defaultConfig.versionName}.apk"
            copy {
                from layout.buildDirectory.file("outputs/apk/release/${apk}")
                into layout.projectDirectory.dir("../release")
            }
            println "release APK -> ../release/${apk}"
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'

    // 模块自身的设置界面（Material You 动态取色）
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
